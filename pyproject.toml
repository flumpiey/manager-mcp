[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manager-mcp"
version = "0.1.0"
description = "Read-only MCP server for Manager.io bookkeeping"
readme = "README.md"
license = "MIT"
authors = [{ name = "Dru Connold" }]
requires-python = ">=3.10"
keywords = [
  "mcp",
  "model-context-protocol",
  "manager.io",
  "accounting",
  "fastmcp",
  "bookkeeping",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fastmcp>=2.0",
  "httpx",
]

[project.urls]
Homepage = "https://github.com/flumpiey/manager-mcp"
Repository = "https://github.com/flumpiey/manager-mcp"
Issues = "https://github.com/flumpiey/manager-mcp/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
  "ruff",
]

[project.scripts]
manager-mcp = "manager_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manager_mcp"]
# Assets under src/manager_mcp/assets ship with the package; do not
# force-include them again (duplicate path breaks the wheel).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
